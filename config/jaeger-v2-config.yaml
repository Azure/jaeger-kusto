# Jaeger V2 configuration with Kusto trace backend and RED metrics
#
# This configuration uses:
#   - gRPC remote storage for traces → jaeger-kusto plugin
#   - PromQL shim for metrics → kusto-promql-shim (built into jaeger-kusto)
#   - OTEL TraceService (no-op write) → jaeger-kusto handles read-only
#
# Start the jaeger-kusto plugin first, then start Jaeger V2 with this config.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: "0.0.0.0:13133"

  jaeger_storage:
    backends:
      kusto_traces:
        grpc:
          endpoint: "jaeger-kusto:8989"
          timeout: 30s
          tls:
            insecure: true
          writer:
            endpoint: "jaeger-kusto:8989"
            tls:
              insecure: true

    metric_backends:
      kusto_metrics:
        prometheus:
          endpoint: "http://jaeger-kusto:9090"

  jaeger_query:
    storage:
      traces: kusto_traces
      metrics: kusto_metrics
    ui:
      config_file: /etc/jaeger/jaeger-ui.json

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: kusto_traces
