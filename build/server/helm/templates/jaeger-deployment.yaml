apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.service.name: kusto-jaeger
  name: jaeger
spec:
  replicas: {{ default 2 .Values.jaeger.replicas }}
  selector:
    matchLabels:
      io.service.name: kusto-jaeger
  template:
    metadata:
      labels:
        io.kompose.network/server-default: "true"
        io.service.name: kusto-jaeger
    spec:
      containers:
        - args:
            - --config=/etc/jaeger/config.yaml
          image: {{ .Values.jaeger.image }}:{{ .Values.jaeger.imageTag }}
          name: jaeger
          ports:
            - containerPort: 16686
              protocol: TCP
            - containerPort: 4317
              protocol: TCP
            - containerPort: 4318
              protocol: TCP
            - containerPort: 13133
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /status
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: jaeger-v2-config
              mountPath: /etc/jaeger/config.yaml
              subPath: config.yaml
            {{- if .Values.metrics.enabled }}
            - name: jaeger-ui-config
              mountPath: /etc/jaeger/jaeger-ui.json
              subPath: jaeger-ui.json
            {{- end }}
      restartPolicy: Always
      volumes:
        - name: jaeger-v2-config
          configMap:
            name: jaeger-v2-config
            items:
              - key: config.yaml
                path: config.yaml
        {{- if .Values.metrics.enabled }}
        - name: jaeger-ui-config
          configMap:
            name: jaeger-ui-config
            items:
              - key: jaeger-ui.json
                path: jaeger-ui.json
        {{- end }}
