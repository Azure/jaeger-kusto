apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  labels:
    io.service.name: kusto-jaeger
  name: jaeger
spec:
  replicas: {{ .Values.jaeger.replicas | default 2 }}
  selector:
    matchLabels:
      io.service.name: kusto-jaeger
  template:
    metadata:
      labels:
        io.kompose.network/server-default: "true"
        io.service.name: kusto-jaeger
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image }}:{{ .Values.jaeger.imageTag }}
          args:
            - --config=/etc/jaeger/jaeger-v2-config.yaml
          ports:
            - name: query-http
              containerPort: 16686
              protocol: TCP
            - name: query-grpc
              containerPort: 16685
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: jaeger-v2-config
              mountPath: /etc/jaeger/jaeger-v2-config.yaml
              subPath: jaeger-v2-config.yaml
            {{- if .Values.metrics.enabled }}
            - name: jaeger-ui-config
              mountPath: /etc/jaeger/jaeger-ui.json
              subPath: jaeger-ui.json
            {{- end }}
      restartPolicy: Always
      volumes:
        - name: jaeger-v2-config
          configMap:
            name: jaeger-v2-config
            items:
              - key: jaeger-v2-config.yaml
                path: jaeger-v2-config.yaml
        {{- if .Values.metrics.enabled }}
        - name: jaeger-ui-config
          configMap:
            name: jaeger-ui-config
            items:
              - key: jaeger-ui.json
                path: jaeger-ui.json
        {{- end }}
