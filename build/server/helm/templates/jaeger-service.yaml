apiVersion: v1
kind: Service
metadata:
  labels:
    io.service.name: kusto-jaeger
  name: jaeger
spec:
  ports:
    - name: "ui"
      port: 16686
      targetPort: 16686
    - name: "otlp-grpc"
      port: 4317
      targetPort: 4317
    - name: "otlp-http"
      port: 4318
      targetPort: 4318
    - name: "health"
      port: 13133
      targetPort: 13133
  selector:
    io.service.name: kusto-jaeger
