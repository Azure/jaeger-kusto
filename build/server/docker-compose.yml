services:
  plugin:
    build:
      context: ../..
      dockerfile: build/server/Dockerfile
    restart: "no"
    command:
      - "--config=/config/jaeger-kusto-plugin-config.json"
    ports:
      - "6060:6060"
      - "8989:8989"
      - "9090:9090"
    volumes:
      - "../../jaeger-kusto-config.json:/config/jaeger-kusto-config.json"
      - "./jaeger-kusto-plugin-config.json:/config/jaeger-kusto-plugin-config.json"
  jaeger:
    image: jaegertracing/jaeger:2
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "13133:13133"   # Health check
    volumes:
      - "../../config/jaeger-v2-config.yaml:/etc/jaeger/config.yaml"
      - "../../config/jaeger-ui.json:/etc/jaeger/jaeger-ui.json"
    command:
      - "--config=/etc/jaeger/config.yaml"
    depends_on:
      - plugin